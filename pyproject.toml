[project]
name = "outcome-extraction"
version = "0.1.0"
description = "Document extraction service (Outcome take-home, AI/ML role)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore:Field name \"schema\":UserWarning",
]
